name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - run: python -m pip install -r requirements/test.lock
      - run: python -m pytest --basetemp="$RUNNER_TEMP/pytest" -m 'not live' -q -p no:cacheprovider
        env:
          HF_HUB_OFFLINE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python scripts/privacy_scan.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: External native prerequisites
        shell: pwsh
        run: |
          choco install ffmpeg tesseract -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\Program Files\Tesseract-OCR' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install -r requirements/test.lock -r requirements/build.lock
      - name: Inventory and native offline checks
        shell: pwsh
        run: |
          python --version
          ffmpeg -version
          ffprobe -version
          tesseract --version
          ./scripts/windows/verify.ps1 -Python (Get-Command python).Source -Scratch $env:RUNNER_TEMP
