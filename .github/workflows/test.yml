name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - run: python -m pip install -r requirements/test.lock
      - run: mkdir -p .test-tmp && TMPDIR="$PWD/.test-tmp" python -m pytest --basetemp=.test-tmp/pytest -m 'not live' -q
        env:
          HF_HUB_OFFLINE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python scripts/privacy_scan.py
