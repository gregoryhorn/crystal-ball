[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crystal-ball-media"
version = "1.2.0"
description = "Four media senses and compact quality evidence for humans and Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<14"]

[project.scripts]
crystal-ball = "crystal_ball.cli:main"

[tool.setuptools.packages.find]
include = ["crystal_ball*"]

[tool.setuptools.package-data]
"crystal_ball.vendor.ffmpeg_skill" = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires user-provided local models and engines"]

[tool.setuptools.data-files]
"share/crystal-ball/requirements" = ["requirements/*.lock"]
"share/crystal-ball/requirements/windows" = ["requirements/windows/*.lock", "requirements/windows/*.json"]
"share/crystal-ball" = ["crystal-ball.example.toml"]
"share/crystal-ball/hermes_plugin/crystal-ball" = ["hermes_plugin/crystal-ball/__init__.py", "hermes_plugin/crystal-ball/plugin.yaml"]
"share/crystal-ball/hermes_plugin/skill/crystal-ball" = ["hermes_plugin/skill/crystal-ball/SKILL.md"]

"share/crystal-ball/scripts" = ["scripts/install_hermes.py"]
