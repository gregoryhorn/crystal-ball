# Copy to crystal-ball.toml, or set CRYSTAL_BALL_CONFIG to a private config.
cache_dir = "~/.cache/crystal-ball"
# projects_root = "./media-projects"
# Native Windows: omit cache_dir for %LOCALAPPDATA%/crystal-ball/cache.
# Use literal quotes or forward slashes, e.g. python = 'C:\Media Tools\hear\Scripts\python.exe'.
# setup --install writes verified isolated CPU interpreter/model paths on Windows.

[hear]
python = ".venv-hear/bin/python"
model = "large-v3-turbo"
device = "cuda" # POSIX default; Windows default is "cpu" (omit to use platform default)
min_free_vram_gb = 3.5 # admission before model load; OOM retries once on CPU
cpu_threads = 4
# Optional argv command; no shell. Must produce a vocals.wav below output_dir.
demucs_command = []
# demucs_command = ["demucs", "--two-stems", "vocals", "-o", "{output_dir}", "{input}"]

[whispercpp]
bin = "" # executable path or command on PATH
model = "" # local ggml model file

[see]
python = ".venv-see/bin/python"
device = "cuda" # Windows: use "cpu", or omit for platform default
model = "openai/clip-vit-large-patch14" # or a local model directory
min_free_vram_gb = 2.5
cpu_threads = 4

[rhythm]
python = ".venv-rhythm/bin/python" # local librosa 1.0.0; CPU only

[scenes]
python = ".venv-scenes/bin/python" # local PySceneDetect 0.7.2; ffmpeg fallback
detector = "content" # content | adaptive
threshold = 27.0 # content score; use e.g. 3.0 for adaptive ratio
min_shot_s = 0.3

[read]
tessdata = "" # empty uses Tesseract's installed data; otherwise a directory

[judge]
backend = "off" # hermes-auxiliary | openai-compatible | off
base_url = "" # OpenAI-compatible API root, including /v1 if required
model = ""
api_key_env = "" # the NAME of an environment variable; never put a key here

[rules]
files = ["rules/*.md"] # Markdown globs relative to this config, not implicit policies

[fix]
protected = ["**/final/**"]
